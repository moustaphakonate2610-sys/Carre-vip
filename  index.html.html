<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #0D0B07;
    --paper: #16130D;
    --card: #1D1810;
    --line: #362D1C;
    --gold: #D4AF37;
    --gold-soft: #E7CD7A;
    --gold-dim: #8A6F27;
    --text: #F3EEDF;
    --text-soft: #A79C82;
    --whatsapp: #25D366;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 90px;
  }

  header{
    position:sticky; top:0; z-index:20;
    background: rgba(13,11,7,0.96);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
    padding: 18px 16px 12px;
  }
  .crest-row{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .crest{ width:38px; height:38px; border-radius:50%; border:1.5px solid var(--gold); display:flex; align-items:center; justify-content:center; font-family:'Cormorant Garamond', serif; font-weight:700; font-size:15px; color:var(--gold); flex-shrink:0; }
  header h1{ font-family:'Cormorant Garamond', serif; font-size:20px; font-weight:700; margin:0; color:var(--gold-soft); letter-spacing:.02em; }
  header p{ font-size:11px; color:var(--text-soft); margin:2px 0 0; }

  .cats{ display:flex; gap:7px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
  .cats::-webkit-scrollbar{ display:none; }
  .cat-btn{ font-size:11.5px; font-weight:600; padding:7px 13px; border-radius:999px; background:var(--card); color:var(--text-soft); white-space:nowrap; border:1px solid var(--line); cursor:pointer; }
  .cat-btn.on{ background:var(--gold); color:#1A1408; border-color:var(--gold); }

  main{ max-width:640px; margin:0 auto; padding: 10px 16px 20px; }
  .section{ display:none; }
  .section.on{ display:block; }
  .section-title{ font-family:'Cormorant Garamond', serif; font-size:16px; font-weight:700; color:var(--gold-dim); text-transform:uppercase; letter-spacing:.08em; margin:20px 0 8px; }
  .section-title:first-child{ margin-top:14px; }

  .item{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:11px 0; border-bottom:1px dashed var(--line); }
  .item-name{ font-family:'Cormorant Garamond', serif; font-size:15px; font-weight:600; margin:0 0 2px; color:var(--text); }
  .item-desc{ font-size:10.5px; color:var(--text-soft); margin:0; line-height:1.4; }
  .item-right{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .price{ font-size:12px; font-weight:700; color:var(--gold-soft); min-width:66px; text-align:right; }
  .add-btn{ width:26px; height:26px; border-radius:50%; background:var(--gold); color:#1A1408; border:none; font-size:15px; line-height:1; cursor:pointer; font-weight:700; }
  .qty-controls{ display:flex; align-items:center; gap:7px; }
  .qty-controls button{ width:24px; height:24px; border-radius:50%; border:1px solid var(--gold); background:transparent; color:var(--gold); font-size:14px; cursor:pointer; }
  .qty-controls span{ font-size:12px; font-weight:700; min-width:14px; text-align:center; }

  .cart-bar{
    position:fixed; bottom:14px; left:16px; right:16px; max-width:608px; margin:0 auto;
    background:var(--gold); color:#1A1408; border-radius:12px; padding:13px 18px;
    display:none; justify-content:space-between; align-items:center; font-size:12.5px; font-weight:700;
    box-shadow:0 12px 28px -10px rgba(0,0,0,.7); cursor:pointer; z-index:30;
  }
  .cart-bar.show{ display:flex; }

  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:flex-end; z-index:40; }
  .overlay.show{ display:flex; }
  .sheet{ background:var(--paper); border-top:1px solid var(--line); border-radius:18px 18px 0 0; width:100%; max-width:640px; margin:0 auto; max-height:85vh; display:flex; flex-direction:column; }
  .sheet-head{ padding:16px 18px 10px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); }
  .sheet-head h2{ font-family:'Cormorant Garamond', serif; font-size:17px; margin:0; color:var(--gold-soft); }
  .close-btn{ background:none; border:none; color:var(--text-soft); font-size:20px; cursor:pointer; }
  .sheet-body{ padding:12px 18px; overflow-y:auto; flex:1; }
  .cart-line{ display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px dashed var(--line); font-size:12.5px; gap:10px; }
  .cart-line-name{ flex:1; }
  .cart-total{ display:flex; justify-content:space-between; padding:14px 0 6px; font-weight:700; color:var(--gold-soft); font-size:14px; }
  .sheet-foot{ padding:12px 18px 20px; border-top:1px solid var(--line); }
  .whatsapp-btn{ background: var(--whatsapp); color:#fff; border:none; font-weight:700; font-size:13.5px; padding:14px 18px; border-radius:10px; cursor:pointer; width:100%; display:flex; align-items:center; justify-content:center; gap:8px; }
  .empty-msg{ font-size:12px; color:var(--text-soft); text-align:center; padding:30px 0; }
</style>

  const cart = {}; // key: "categorie|nom" -> {name, price, qty}

  function fmt(n){ return n.toLocaleString('fr-FR').replace(/,/g, ' ') + ' F'; }

  function itemKey(cat, name){ return cat + '|' + name; }

  function renderCats(){
    const bar = document.getElementById('catsBar');
    const cats = Object.keys(MENU);
    bar.innerHTML = cats.map((c,i) => `<button class="cat-btn${i===0?' on':''}" data-cat="${c}">${c}</button>`).join('');
    bar.querySelectorAll('.cat-btn').forEach(btn => {
      btn.addEventListener('click', () => showSection(btn.dataset.cat));
    });
  }

  function renderSections(){
    const main = document.getElementById('main');
    main.innerHTML = Object.keys(MENU).map((cat, i) => {
      const items = MENU[cat].map(([name, desc, price]) => {
        const key = itemKey(cat, name);
        return `
          <div class="item" data-key="${key}">
            <div>
              <p class="item-name">${name}</p>
              ${desc ? `<p class="item-desc">${desc}</p>` : ''}
            </div>
            <div class="item-right" id="right-${btoa(unescape(encodeURIComponent(key)))}">
              <span class="price">${fmt(price)}</span>
              <button class="add-btn" onclick="addItem('${cat.replace(/'/g,"\\'")}','${name.replace(/'/g,"\\'")}',${price})">+</button>
            </div>
          </div>`;
      }).join('');
      return `<section class="section${i===0?' on':''}" data-cat="${cat}"><div class="section-title">${cat}</div>${items}</section>`;
    }).join('');
  }

  function showSection(cat){
    document.querySelectorAll('.section').forEach(s => s.classList.toggle('on', s.dataset.cat === cat));
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('on', b.dataset.cat === cat));
  }

  function addItem(cat, name, price){
    const key = itemKey(cat, name);
    if(!cart[key]) cart[key] = { cat, name, price, qty: 0 };
    cart[key].qty += 1;
    refreshItemRight(key);
    refreshCartBar();
  }

  function changeQty(key, delta){
    if(!cart[key]) return;
    cart[key].qty += delta;
    if(cart[key].qty <= 0) delete cart[key];
    refreshItemRight(key);
    refreshCartBar();
    renderCartBody();
  }

  function refreshItemRight(key){
    const el = document.getElementById('right-' + btoa(unescape(encodeURIComponent(key))));
    if(!el) return;
    const entry = cart[key];
    if(entry && entry.qty > 0){
      el.innerHTML = `
        <span class="price">${fmt(entry.price)}</span>
        <div class="qty-controls">
          <button onclick="changeQty('${key.replace(/'/g,"\\'")}',-1)">−</button>
          <span>${entry.qty}</span>
          <button onclick="changeQty('${key.replace(/'/g,"\\'")}',1)">+</button>
        </div>`;
    } else {
      const [cat, name] = key.split('|');
      const item = MENU[cat].find(x => x[0] === name);
      el.innerHTML = `<span class="price">${fmt(item[2])}</span><button class="add-btn" onclick="addItem('${cat.replace(/'/g,"\\'")}','${name.replace(/'/g,"\\'")}',${item[2]})">+</button>`;
    }
  }

  function cartTotalAmount(){
    return Object.values(cart).reduce((sum, e) => sum + e.price * e.qty, 0);
  }
  function cartCountAmount(){
    return Object.values(cart).reduce((sum, e) => sum + e.qty, 0);
  }

  function refreshCartBar(){
    const bar = document.getElementById('cartBar');
    const count = cartCountAmount();
    if(count > 0){
      bar.classList.add('show');
      document.getElementById('cartCount').textContent = count + (count > 1 ? ' articles' : ' article');
      document.getElementById('cartTotal').textContent = fmt(cartTotalAmount()) + ' · Voir le panier →';
    } else {
      bar.classList.remove('show');
    }
  }

  function openCart(){
    renderCartBody();
    document.getElementById('overlay').classList.add('show');
  }
  function closeCart(){
    document.getElementById('overlay').classList.remove('show');
  }

  function renderCartBody(){
    const body = document.getElementById('cartBody');
    const entries = Object.entries(cart);
    const footTotal = document.getElementById('cartFootTotal');
    const sendBtn = document.getElementById('sendBtn');
    if(entries.length === 0){
      body.innerHTML = '<p class="empty-msg">Votre panier est vide.</p>';
      footTotal.style.display = 'none';
      sendBtn.style.display = 'none';
      return;
    }
    footTotal.style.display = 'flex';
    sendBtn.style.display = 'flex';
    body.innerHTML = entries.map(([key, e]) => `
      <div class="cart-line">
        <span class="cart-line-name">${e.qty}× ${e.name}</span>
        <span>${fmt(e.price * e.qty)}</span>
      </div>
    `).join('');
    document.getElementById('footTotalAmount').textContent = fmt(cartTotalAmount());
  }

  function buildOrderItems(){
    return Object.values(cart).map(e => ({ name: e.name, qty: e.qty, price: e.price }));
  }

  async function sendOrder(){
    const entries = Object.values(cart);
    if(entries.length === 0) return;
    const table = (document.getElementById('tableInput').value || 'Table non précisée').trim();

    if(!db){
      alert("La connexion à la base de données n'est pas encore configurée — utilise pour l'instant le bouton WhatsApp ci-dessous.");
      return;
    }

    const sendBtn = document.getElementById('sendBtn');
    sendBtn.disabled = true;
    sendBtn.textContent = "Envoi en cours...";

    const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 8000));

    try {
      await Promise.race([
        db.collection('commandes').add({
          table: table,
          items: buildOrderItems(),
          total: cartTotalAmount(),
          status: 'pending',
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        }),
        timeout
      ]);
      sendBtn.textContent = "Commande envoyée ✓";
      document.getElementById('waBtn').style.display = 'none';
      setTimeout(() => { closeCart(); location.reload(); }, 1400);
    } catch(e) {
      console.error(e);
      sendBtn.disabled = false;
      sendBtn.textContent = "Envoyer la commande";
      if(e.message === 'timeout'){
        alert("La connexion internet est trop faible pour envoyer la commande. Vérifie ta connexion (Wi-Fi ou données mobiles) et réessaie, ou utilise le bouton WhatsApp ci-dessous.");
      } else {
        alert("La commande n'a pas pu être envoyée. Réessaie, ou utilise le bouton WhatsApp ci-dessous.");
      }
    }
  }

  function sendToWhatsapp(){
    const entries = Object.values(cart);
    if(entries.length === 0) return;
    const table = (document.getElementById('tableInput').value || '').trim();
    let msg = "Care VIP — Nouvelle commande\n\n";
    if(table) msg += `Table : ${table}\n\n`;
    entries.forEach(e => {
      msg += `${e.qty}× ${e.name} — ${fmt(e.price * e.qty)}\n`;
    });
    msg += `\nTotal : ${fmt(cartTotalAmount())}`;
    const url = `https://wa.me/${CAISSIERE_NUMBER}?text=${encodeURIComponent(msg)}`;
    window.open(url, '_blank');
  }

  renderCats();
  renderSections();
</script>

</body>
</html>
