<html lang="fr">

<style>
  :root{
    --bg:#0D0B07; --paper:#16130D; --card:#1D1810; --line:#362D1C;
    --gold:#D4AF37; --gold-soft:#E7CD7A; --gold-dim:#8A6F27;
    --text:#F3EEDF; --text-soft:#B8AE95;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:-apple-system, sans-serif; }
  .header{ padding:24px 20px 16px; }
  .brand{ display:flex; align-items:center; gap:14px; }
  .logo{ width:52px; height:52px; border:1.5px solid var(--gold); border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--gold); font-family:Georgia,serif; font-size:18px; }
  h1{ font-family:Georgia,serif; color:var(--gold-soft); font-size:28px; margin:0; }
  .tagline{ color:var(--text-soft); font-size:13px; margin-top:2px; }
  .table-input{ width:100%; margin-top:18px; padding:14px 16px; background:var(--card); border:1px solid var(--line); border-radius:10px; color:var(--text); font-size:15px; }
  .cats{ display:flex; gap:8px; overflow-x:auto; padding:16px 20px; }
  .cat-btn{ flex:none; padding:9px 16px; border-radius:20px; border:1px solid var(--line); background:var(--card); color:var(--text-soft); font-size:14px; white-space:nowrap; }
  .cat-btn.active{ background:var(--gold); color:#1A1408; border-color:var(--gold); font-weight:600; }
  .cat-title{ color:var(--gold-dim); font-family:Georgia,serif; letter-spacing:1.5px; font-size:14px; padding:8px 20px; text-transform:uppercase; }
  .item{ display:flex; justify-content:space-between; align-items:center; padding:14px 20px; border-bottom:1px dashed var(--line); }
  .item-name{ font-family:Georgia,serif; font-size:16px; }
  .item-desc{ color:var(--text-soft); font-size:12px; margin-top:2px; }
  .item-right{ display:flex; align-items:center; gap:10px; }
  .price{ color:var(--gold-soft); font-weight:600; }
  .qty-ctrl{ display:flex; align-items:center; gap:8px; }
  .qty-btn{ width:30px; height:30px; border-radius:50%; border:1px solid var(--gold-dim); background:none; color:var(--gold-soft); font-size:16px; }
  .add-btn{ width:30px; height:30px; border-radius:50%; border:none; background:var(--gold-dim); color:#1A1408; font-size:16px; }
  .cart-bar{ position:fixed; bottom:0; left:0; right:0; background:var(--gold); color:#1A1408; padding:14px 20px; display:none; justify-content:space-between; align-items:center; font-weight:700; }
  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:flex-end; z-index:20; }
  .cart-panel{ background:var(--paper); width:100%; max-height:80vh; overflow-y:auto; border-radius:20px 20px 0 0; padding:22px 20px 30px; }
  .cart-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .cart-head h2{ font-family:Georgia,serif; color:var(--gold-soft); font-size:20px; margin:0; }
  .close-btn{ background:none; border:none; color:var(--text-soft); font-size:20px; }
  .cart-line{ display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px dashed var(--line); font-size:14px; }
  .cart-total{ display:flex; justify-content:space-between; padding:16px 0; font-weight:700; font-size:17px; color:var(--gold-soft); }
  .validate-btn{ width:100%; padding:16px; background:var(--gold); color:#1A1408; border:none; border-radius:10px; font-weight:700; font-size:16px; }
  .empty-msg{ color:var(--text-soft); font-size:13px; padding:6px 0 16px; }
  .confirm-box{ text-align:center; padding:30px 10px 10px; }
  .confirm-box .check{ font-size:40px; color:var(--gold); }
  .confirm-box p{ color:var(--text-soft); font-size:14px; margin-top:8px; }
</style>
</head>
<body>

  <div class="header">

      <div class="logo">CV</div>
      <div>
        <h1>Care VIP</h1>
        <div class="tagline">Scannez, choisissez, on vous envoie ça en cuisine.</div>
      </div>
    </div>
    <input class="table-input" id="tableInput" placeholder="Numéro de table (ex : Table 4)">
  </div>

  <div class="cart-bar" id="cartBar" onclick="openCart()">
    <span id="cartCount">0 article</span>

  <div class="overlay" id="overlay" onclick="if(event.target===this) closeCart()">
    <div class="cart-panel">
      <div class="cart-head">
        <h2>Votre commande</h2>
        <button class="close-btn" onclick="closeCart()">✕</button>
      </div>
      <div id="cartLines"></div>
      <textarea id="specialInstructions" placeholder="Instructions spéciales (optionnel) — ex : sans piment, cuisson à point..."
        style="width:100%; margin:10px 0 4px; padding:12px 14px; background:var(--card); border:1px solid var(--line); border-radius:10px; color:var(--text); font-size:13.5px; font-family:inherit; resize:none; min-height:56px;"></textarea>
      <div class="cart-total">
        <span>Total</span><span id="cartTotalAmount">0 F</span>
      </div>
      <button class="validate-btn" id="validateBtn" onclick="validateOrder()">Valider la commande</button>
    </div>
  </div>

  <div class="overlay" id="confirmOverlay">
    <div class="cart-panel">
      <div class="confirm-box">
        <div class="check">✓</div>
        <h2 style="font-family:Georgia,serif;color:var(--gold-soft);margin-top:10px;">Commande validée</h2>
        <p>Table : <span id="confirmTable"></span></p>
        <p>Total : <span id="confirmTotal"></span></p>
      </div>
      <button class="validate-btn" onclick="closeConfirm()">Fermer</button>
    </div>
  </div>

  const cart = {};

  function fmt(n){ return n.toLocaleString('fr-FR').replace(/,/g, ' ') + ' F'; }
  function itemKey(cat, name){ return cat + '|' + name; }

  function renderCats(){
    const bar = document.getElementById('catsBar');
    const cats = Object.keys(MENU);
    bar.innerHTML = cats.map((c,i) =>
      `<button class="cat-btn ${i===0?'active':''}" data-cat="${c}">${c}</button>`
    ).join('');
    bar.querySelectorAll('.cat-btn').forEach(btn => {
      btn.addEventListener('click', () => showSection(btn.dataset.cat));
    });
    showSection(cats[0]);
  }

  function showSection(cat){
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
    const list = document.getElementById('menuList');
    list.innerHTML = `<div class="cat-title">${cat}</div>` + MENU[cat].map(([name, desc, price]) => {
      const key = itemKey(cat, name);
      const qty = cart[key] ? cart[key].qty : 0;
      return `
        <div class="item">
          <div>
            <div class="item-name">${name}</div>
            ${desc ? `<div class="item-desc">${desc}</div>` : ''}
          </div>
          <div class="item-right">
            <span class="price">${fmt(price)}</span>
            ${qty > 0 ? `
              <div class="qty-ctrl">
                <button class="qty-btn" onclick="changeQty('${key.replace(/'/g,"\\'")}',-1)">−</button>
                <span>${qty}</span>
                <button class="qty-btn" onclick="changeQty('${key.replace(/'/g,"\\'")}',1)">+</button>
              </div>
            ` : `<button class="add-btn" onclick="addItem('${cat.replace(/'/g,"\\'")}','${name.replace(/'/g,"\\'")}',${price})">+</button>`}
          </div>
        </div>`;
    }).join('');
  }

  function addItem(cat, name, price){
    const key = itemKey(cat, name);
    if(!cart[key]) cart[key] = { cat, name, price, qty: 0 };
    cart[key].qty++;
    updateCartBar();
    const activeCat = document.querySelector('.cat-btn.active').dataset.cat;
    showSection(activeCat);
  }

  function changeQty(key, delta){
    if(!cart[key]) return;
    cart[key].qty += delta;
    if(cart[key].qty <= 0) delete cart[key];
    updateCartBar();
    const activeCat = document.querySelector('.cat-btn.active').dataset.cat;
    showSection(activeCat);
    renderCartLines();
  }

  function cartTotalAmount(){
    return Object.values(cart).reduce((sum, it) => sum + it.price * it.qty, 0);
  }
  function cartItemCount(){
    return Object.values(cart).reduce((sum, it) => sum + it.qty, 0);
  }

  function updateCartBar(){
    const bar = document.getElementById('cartBar');
    const count = cartItemCount();
    if(count === 0){ bar.style.display = 'none'; return; }
    bar.style.display = 'flex';
    document.getElementById('cartCount').textContent = count + (count > 1 ? ' articles' : ' article');
    document.getElementById('cartAmount').textContent = fmt(cartTotalAmount()) + ' · Voir le panier →';
  }

  function renderCartLines(){
    const el = document.getElementById('cartLines');
    const items = Object.values(cart);
    if(items.length === 0){
      el.innerHTML = `<div class="empty-msg">Votre panier est vide.</div>`;
    } else {
      el.innerHTML = items.map(it =>
        `<div class="cart-line"><span>${it.qty}× ${it.name}</span><span>${fmt(it.price * it.qty)}</span></div>`
      ).join('');
    }
    document.getElementById('cartTotalAmount').textContent = fmt(cartTotalAmount());
  }

  function openCart(){
    renderCartLines();
    document.getElementById('overlay').style.display = 'flex';
  }
  function closeCart(){
    document.getElementById('overlay').style.display = 'none';
  }

  async function validateOrder(){
    if(cartItemCount() === 0) return;
    const table = document.getElementById('tableInput').value.trim() || 'Non précisée';
    const notes = document.getElementById('specialInstructions').value.trim();
    const total = cartTotalAmount();
    const items = Object.values(cart).map(it => ({ name: it.name, qty: it.qty, price: it.price }));

    const validateBtn = document.getElementById('validateBtn');
    validateBtn.disabled = true;
    validateBtn.textContent = "Envoi en cours...";

    const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 8000));

    try {
      await Promise.race([
        db.collection('commandes').add({
          table: table,
          items: items,
          notes: notes,
          total: total,
          status: 'received',
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        }),
        timeout
      ]);
      document.getElementById('confirmTable').textContent = table;
      document.getElementById('confirmTotal').textContent = fmt(total);
      closeCart();
      document.getElementById('confirmOverlay').style.display = 'flex';
    } catch(e){
      console.error(e);
      alert("La commande n'a pas pu être envoyée à la caisse. Vérifie ta connexion et réessaie.");
    } finally {
      validateBtn.disabled = false;
      validateBtn.textContent = "Valider la commande";
    }
  }

  function closeConfirm(){
    document.getElementById('confirmOverlay').style.display = 'none';
    for(const k in cart) delete cart[k];
    updateCartBar();
    document.getElementById('tableInput').value = '';
    document.getElementById('specialInstructions').value = '';
    const activeCat = document.querySelector('.cat-btn.active').dataset.cat;
    showSection(activeCat);
  }

  renderCats();
</script>
