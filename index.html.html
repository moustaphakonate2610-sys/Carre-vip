<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Care VIP — Caisse</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#0D0B07; --paper:#16130D; --card:#1D1810; --line:#362D1C;
    --gold:#D4AF37; --gold-soft:#E7CD7A; --gold-dim:#8A6F27;
    --text:#F3EEDF; --text-soft:#B8AE95;
    --st-received:#8A6F27; --st-progress:#B8860B; --st-ready:#3E7B4F;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:-apple-system, sans-serif; padding-bottom:30px; }
  .header{ padding:22px 20px 14px; }
  .brand{ display:flex; align-items:center; gap:14px; }
  .logo{ width:48px; height:48px; border:1.5px solid var(--gold); border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--gold); font-family:Georgia,serif; font-size:16px; }
  h1{ font-family:Georgia,serif; color:var(--gold-soft); font-size:24px; margin:0; }
  .tagline{ color:var(--text-soft); font-size:12.5px; margin-top:2px; }
  .empty-state{ text-align:center; color:var(--text-soft); font-size:14px; padding:60px 20px; }
  .order-card{ background:var(--card); border:1px solid var(--line); border-radius:14px; margin:14px 20px; padding:16px 18px; }
  .order-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
  .order-table{ font-family:Georgia,serif; font-size:19px; color:var(--gold-soft); }
  .order-time{ color:var(--text-soft); font-size:12px; text-align:right; }
  .order-items{ margin:10px 0; }
  .order-item{ display:flex; justify-content:space-between; font-size:14px; padding:4px 0; border-bottom:1px dashed var(--line); }
  .order-notes{ background:rgba(212,175,55,.08); border:1px solid var(--gold-dim); border-radius:8px; padding:8px 10px; font-size:12.5px; color:var(--gold-soft); margin-top:8px; }
  .order-total{ display:flex; justify-content:space-between; font-weight:700; font-size:15px; margin-top:10px; padding-top:8px; border-top:1px solid var(--line); }
  .status-row{ display:flex; align-items:center; justify-content:space-between; margin-top:14px; }
  .status-badge{ padding:6px 12px; border-radius:20px; font-size:12px; font-weight:700; color:#1A1408; }
  .status-badge.received{ background:var(--st-received); color:#F3EEDF; }
  .status-badge.progress{ background:var(--st-progress); }
  .status-badge.ready{ background:var(--st-ready); color:#F3EEDF; }
  .next-btn{ padding:9px 16px; border-radius:8px; border:none; background:var(--gold); color:#1A1408; font-weight:700; font-size:13px; }
  .next-btn.done{ background:var(--line); color:var(--text-soft); }
</style>
</head>
<body>

  <div class="header">
    <div class="brand">
      <div class="logo">CV</div>
      <div>
        <h1>Care VIP</h1>
        <div class="tagline">Caisse — commandes en temps réel</div>
      </div>
    </div>
  </div>

  <div id="ordersList"></div>

<script>
  const dbConfig = {
    apiKey: "AIzaSyBkoN4rlxgTThqDUaaKXAcD0b91EdiqjF0",
    authDomain: "carre-vip-8769e.firebaseapp.com",
    projectId: "carre-vip-8769e",
    storageBucket: "carre-vip-8769e.firebasestorage.app",
    messagingSenderId: "715799301789",
    appId: "1:715799301789:web:1b5e2edecd8bd38e98ce74"
  };
  let db = null;
  try {
    firebase.initializeApp(dbConfig);
    db = firebase.firestore();
  } catch(e) { console.error(e); }

  const STATUS_LABELS = { received: "Reçue", progress: "En préparation", ready: "Prête" };
  const STATUS_NEXT = { received: "progress", progress: "ready", ready: null };
  const STATUS_NEXT_LABEL = { received: "Passer en préparation", progress: "Marquer comme prête", ready: null };

  function fmt(n){ return (n||0).toLocaleString('fr-FR').replace(/,/g, ' ') + ' F'; }

  function formatTime(ts){
    if(!ts || !ts.toDate) return '—';
    const d = ts.toDate();
    return d.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
  }

  function renderOrders(docs){
    const list = document.getElementById('ordersList');
    if(docs.length === 0){
      list.innerHTML = `<div class="empty-state">Aucune commande pour le moment.</div>`;
      return;
    }
    list.innerHTML = docs.map(doc => {
      const o = doc.data();
      const id = doc.id;
      const status = o.status || 'received';
      const itemsHtml = (o.items || []).map(it =>
        `<div class="order-item"><span>${it.qty}× ${it.name}</span><span>${fmt(it.price * it.qty)}</span></div>`
      ).join('');
      const notesHtml = o.notes ? `<div class="order-notes">${o.notes}</div>` : '';
      const nextStatus = STATUS_NEXT[status];
      const nextLabel = STATUS_NEXT_LABEL[status];
      const btnHtml = nextStatus
        ? `<button class="next-btn" onclick="advanceStatus('${id}','${nextStatus}')">${nextLabel}</button>`
        : `<button class="next-btn done" disabled>Commande prête</button>`;
      return `
        <div class="order-card">
          <div class="order-top">
            <div class="order-table">Table ${o.table || '—'}</div>
            <div class="order-time">${formatTime(o.timestamp)}</div>
          </div>
          <div class="order-items">${itemsHtml}</div>
          ${notesHtml}
          <div class="order-total"><span>Total</span><span>${fmt(o.total)}</span></div>
          <div class="status-row">
            <span class="status-badge ${status}">${STATUS_LABELS[status] || status}</span>
            ${btnHtml}
          </div>
        </div>`;
    }).join('');
  }

  function advanceStatus(id, newStatus){
    db.collection('commandes').doc(id).update({ status: newStatus }).catch(e => console.error(e));
  }

  if(db){
    db.collection('commandes').orderBy('timestamp', 'desc').onSnapshot(snapshot => {
      renderOrders(snapshot.docs);
    }, err => {
      console.error(err);
      document.getElementById('ordersList').innerHTML =
        `<div class="empty-state">Impossible de charger les commandes. Vérifie ta connexion.</div>`;
    });
  }
</script>
</body>
</html>
